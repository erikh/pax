name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # The default feature set has zero system dependencies and must build, test,
  # lint, and document cleanly on every platform with no Bluetooth hardware.
  default:
    name: default (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Test
        run: cargo test --workspace
      - name: Docs
        env:
          RUSTDOCFLAGS: "-D warnings -D rustdoc::broken_intra_doc_links"
        run: cargo doc --workspace --no-deps

  # The real backends are Linux-only and need D-Bus development headers. We only
  # build and lint them here (running them needs a Bluetooth adapter, which CI
  # runners do not have — see the PAX_HW_TESTS-gated integration tests).
  backends:
    name: real backends (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      # Every backend compiles on the host (the jni and btleplug wrappers are
      # host-portable), so we build and lint them all here. Real on-device runs
      # happen via the PAX_HW_TESTS-gated tests, not in CI.
      - name: Build all backends (desktop + mobile)
        run: cargo build -p pax-transport --features "all-backends,android,ios,port-auth-nm"
      - name: Clippy all backends
        run: cargo clippy -p pax-transport --features "all-backends,android,ios,port-auth-nm" --all-targets
      - name: Test feature-gated unit tests (OBEX client, NM mapping)
        run: cargo test -p pax-transport --features "android,port-auth-nm"

  # Verify the Android backend cross-compiles to real Android ABIs (it is a pure
  # Rust library with no C deps, so this needs only the Rust target — no NDK), and
  # that the Java companion compiles against the Android API.
  android:
    name: android cross-build + companion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - name: Cross-compile android backend (device + emulator ABIs)
        run: |
          cargo build -p pax-transport --target aarch64-linux-android --features android
          cargo build -p pax-transport --target x86_64-linux-android --features android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install platform + compile the Java companion
        run: |
          sdkmanager "platforms;android-34"
          javac -Xlint:all -Werror \
            -cp "$ANDROID_HOME/platforms/android-34/android.jar" \
            -d "$RUNNER_TEMP/companion" \
            crates/pax-transport/android-companion/dev/pax/PaxBluetooth.java
